[package]
name = "binsight-store"
description = "The SQLite database: schema, migrations, backups and repositories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Reads and writes only tests need: planting a registry row directly (a damaged one, for
# instance) and reading a decoding result back. Production code never calls them.
test-support = []

[dependencies]
binsight-core.workspace = true
binsight-solana.workspace = true
deadpool-sqlite.workspace = true
hex.workspace = true
jiff.workspace = true
rusqlite.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
