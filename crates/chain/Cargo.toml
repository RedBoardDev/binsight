[package]
name = "binsight-chain"
description = "The Helius JSON-RPC and WebSocket client, credit accounting and budget."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A scripted transport for the tests of the crates above the chain client: they script the
# provider's answers instead of reaching the network.
test-support = []

[dependencies]
binsight-core.workspace = true
binsight-solana.workspace = true
jiff.workspace = true
reqwest.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util"] }
