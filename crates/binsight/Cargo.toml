[package]
name = "binsight"
description = "Self-hostable portfolio tracker for Meteora DLMM liquidity positions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "binsight"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
binsight-api.workspace = true
binsight-chain.workspace = true
binsight-core.workspace = true
binsight-engine.workspace = true
binsight-solana.workspace = true
binsight-store.workspace = true
clap.workspace = true
dialoguer.workspace = true
getrandom.workspace = true
hex.workspace = true
rust-embed.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
insta.workspace = true
jiff.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }
