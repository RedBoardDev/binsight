[package]
name = "binsight-engine"
description = "Orchestration: engine lifecycle, scheduling and domain events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Lets the tests of other crates (the API) run a real engine on a temporary database, without
# depending on the store themselves.
test-support = ["dep:tempfile", "binsight-chain/test-support"]

[dependencies]
binsight-chain.workspace = true
binsight-core.workspace = true
binsight-dlmm.workspace = true
binsight-ledger.workspace = true
binsight-solana.workspace = true
binsight-store.workspace = true
jiff.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
binsight-chain = { workspace = true, features = ["test-support"] }
binsight-store = { workspace = true, features = ["test-support"] }
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
