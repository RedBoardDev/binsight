[package]
name = "binsight-engine"
description = "Orchestration: engine lifecycle, scheduling and domain events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Lets the tests of other crates (the API) run a real engine on a temporary database, without
# depending on the store themselves.
test-support = ["dep:tempfile"]

[dependencies]
binsight-core.workspace = true
binsight-store.workspace = true
jiff.workspace = true
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
