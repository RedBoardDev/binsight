# cargo-about: the license notices of the Rust crates the binary ships, written to
# crates/binsight/third-party-licenses.txt by `just rust-licenses` (CI checks that it is current).
# The accepted licenses are the ones deny.toml allows; keep the two lists in step.
accepted = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unlicense", "CC0-1.0", "MPL-2.0", "BSL-1.0", "0BSD",
  "CDLA-Permissive-2.0",
]
# Only what ends up in the binary: build scripts, proc macros of dev tools and tests do not ship.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
