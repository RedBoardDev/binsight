<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Offline · Binsight</title>
    <style>
      /* Hard-coded because a service-worker fallback cannot reach the app's CSS. Keep these in step
         with the `theme` layer in web/src/app/globals.css. */
      :root {
        color-scheme: dark;
        --background: #0b0f14;
        --surface: #161c26;
        --foreground: #f1f3f6;
        --muted: #aeb4c0;
        --accent: #22d3ee;
        --accent-foreground: #08121a;
        --border: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(1200px 560px at 50% -280px, rgba(34, 211, 238, 0.08), transparent 72%),
          var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        height: 100%;
        padding: 24px;
        text-align: center;
      }
      .mark {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 34px;
        margin-bottom: 2px;
      }
      .mark span {
        width: 6px;
        border-radius: 3px;
        background: var(--accent);
      }
      .mark span:nth-child(1),
      .mark span:nth-child(5) {
        height: 15px;
        opacity: 0.58;
      }
      .mark span:nth-child(2),
      .mark span:nth-child(4) {
        height: 24px;
        opacity: 0.85;
      }
      .mark span:nth-child(3) {
        height: 34px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }
      button {
        margin-top: 6px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-foreground);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: filter 150ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <h1>You're offline</h1>
      <p>
        Binsight needs a connection for live on-chain data. It'll reconnect automatically — or retry
        now.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
