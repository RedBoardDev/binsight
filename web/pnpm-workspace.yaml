# Settings only: web/ is a single package, so there is no `packages:` list.
engineStrict: true
saveExact: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
# Every dependency build script is reviewed before it is allowed here (true) or explicitly skipped (false).
allowBuilds: {}
# Versions published before their package adopted npm provenance look like a trust downgrade.
# Each entry is an exact version that was checked by hand; never exclude a whole package.
trustPolicyExclude:
  - semver@6.3.1
  # Required by workbox-build 7.4.1; published without provenance, no install script.
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
# workbox-build 7.4.1 still asks for glob 11, which is deprecated for known vulnerabilities; glob 13
# keeps the globSync API it uses.
overrides:
  workbox-build>glob: 13.0.6
