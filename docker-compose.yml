# binsight with Docker Compose: one service, one volume.
# From a clone of the repository, put BINSIGHT_PASSWORD and BINSIGHT_HELIUS_API_KEY in a .env file
# next to this one, then run `docker compose up -d --build` and open http://localhost:8080.
name: binsight-app

services:
  binsight:
    # Built from this folder; set BINSIGHT_IMAGE to run an image built or pulled elsewhere.
    build: .
    image: ${BINSIGHT_IMAGE:-binsight:local}
    restart: unless-stopped
    ports:
      # This machine only. Set BINSIGHT_PUBLISH_ADDRESS=0.0.0.0 to open the port to the network on
      # purpose: Docker's published ports bypass most host firewalls.
      - "${BINSIGHT_PUBLISH_ADDRESS:-127.0.0.1}:${BINSIGHT_PORT:-8080}:8080"
    environment:
      BINSIGHT_PASSWORD: ${BINSIGHT_PASSWORD:?set BINSIGHT_PASSWORD (at least 12 characters)}
      BINSIGHT_HELIUS_API_KEY: ${BINSIGHT_HELIUS_API_KEY:?set BINSIGHT_HELIUS_API_KEY}
      # BINSIGHT_PUBLIC_URL: https://binsight.example.com
      # BINSIGHT_LOG_FORMAT: json
    volumes:
      - data:/data
    stop_grace_period: 15s

volumes:
  data:
