# binsight with Docker Compose: one service, one volume.
# Put BINSIGHT_PASSWORD and BINSIGHT_HELIUS_API_KEY in a .env file next to this one, then run
# `docker compose up -d` and open http://localhost:8080.
name: binsight-app

services:
  binsight:
    image: ${BINSIGHT_IMAGE:-ghcr.io/redboarddev/binsight:edge}
    restart: unless-stopped
    ports:
      - "${BINSIGHT_PORT:-8080}:8080"
    environment:
      BINSIGHT_PASSWORD: ${BINSIGHT_PASSWORD:?set BINSIGHT_PASSWORD (at least 12 characters)}
      BINSIGHT_HELIUS_API_KEY: ${BINSIGHT_HELIUS_API_KEY:?set BINSIGHT_HELIUS_API_KEY}
      # BINSIGHT_PUBLIC_URL: https://binsight.example.com
      # BINSIGHT_LOG_FORMAT: json
    volumes:
      - data:/data
    stop_grace_period: 15s

volumes:
  data:
