# Local development stack for Binsight (production uses docker-compose.prod.yml).
#   make db-up   -> only Postgres, on host port 5435 — matches the API's default DATABASE_URL
#                   (postgres://meteora:meteora@localhost:5435/meteora), for `make dev-api`.
#   make up      -> Postgres + the API container (reads the repo .env).
# Postgres is the only durable store; the API is stateless on disk. The `meteora` user/database
# name predates the Binsight rename and is kept on purpose: it identifies existing data.

# An explicit project name, distinct from the production one (`binsight`, docker-compose.prod.yml).
# Without it the project is named after the checkout directory — `binsight` — so `make db-up` /
# `make down` run from a checkout that also hosts production would recreate or stop the PROD
# containers and mount the prod `binsight_pgdata` volume.
name: binsight-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: binsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meteora
      POSTGRES_PASSWORD: meteora
      POSTGRES_DB: meteora
    # 5435 on the host to avoid clashing with other local Postgres instances (5432/5433/5434).
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meteora -d meteora']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The api runs INSIDE compose, so DATABASE_URL must target the `postgres` service on the compose
      # network — the code default (localhost:5435) is only reachable when the api runs on the host.
      # Set here (not just .env) so the compose stack is self-contained.
      - DATABASE_URL=postgres://meteora:meteora@postgres:5432/meteora
    ports:
      - '8787:8787'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
