name: Binsight
options:
  bundleIdPrefix: com.binsight
  # Must match BinsightKit's Package.swift platform floor (see the rationale there).
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  BinsightKit:
    path: BinsightKit

targets:
  BinsightMac:
    type: application
    platform: macOS
    sources:
      - BinsightMac
    dependencies:
      - package: BinsightKit
    info:
      path: BinsightMac/Info.generated.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Binsight
        NSHumanReadableCopyright: ""
        MLPMApiURL: "$(MLPM_API_URL)"
    settings:
      base:
        PRODUCT_NAME: Binsight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.binsight.mac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0" # Swift 6 language mode, matching BinsightKit
        ENABLE_HARDENED_RUNTIME: NO
        MLPM_API_URL: http://localhost:8787
