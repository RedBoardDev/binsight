# One workflow, one verdict: every job below must pass for `ci-ok` to pass.
# Each job calls the same `just` recipe a contributor runs locally.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pick the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then range="$BASE..$HEAD"
          elif [[ "$GITHUB_REF" == refs/tags/* ]] || [ "$EVENT" = workflow_dispatch ]; then range=""
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$BEFORE" = "$zero" ]; then range="$SHA~..$SHA"; else range="$BEFORE..$SHA"; fi
          # A branch push is checked from main, not from `before`: after a force-push `before` is unreachable.
          else range="origin/main..$SHA"; fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
      - if: steps.range.outputs.range != ''
        uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f # v1.1.11
        with:
          args: -vv --no-merge-commit
          commits: ${{ steps.range.outputs.range }}

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by digest like the actions: a tag can be moved to another image.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1

  fmt:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: just@1.58.0
      - run: just rust-fmt-check

  clippy:
    name: Rust build and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Release (tag) builds never restore a cache, so a poisoned cache cannot reach them.
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: just@1.58.0
      - run: just rust-build-check
      - run: just rust-lint

  test:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Release (tag) builds never restore a cache, so a poisoned cache cannot reach them.
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146
      - run: just rust-test
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-report
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn

  deny:
    name: Licenses, notices, advisories and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: just@1.58.0,cargo-deny@0.20.2,cargo-about@0.9.2
      - run: just rust-deny
      - run: just rust-licenses-check

  layering:
    name: Layering, structure and unused dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Release (tag) builds never restore a cache, so a poisoned cache cannot reach them.
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: just@1.58.0,cargo-machete@0.9.2
      - run: just rust-layering
      - run: just rust-structure
      - run: just rust-unused-deps

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Release (tag) builds never restore a cache, so a poisoned cache cannot reach them.
          # zizmor cannot evaluate the expression, hence the ignore.
          package-manager-cache: false
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pnpm' || '' }} # zizmor: ignore[cache-poisoning]
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Every check runs even when an earlier one fails, so one push reports everything to fix;
      # the gate below turns any failure into a red job.
      - name: Lint and format
        id: lint
        continue-on-error: true
        run: pnpm lint
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck
      - name: Unit and architecture tests
        id: test
        continue-on-error: true
        run: pnpm test
      - name: Message catalogs up to date and translated
        id: i18n
        continue-on-error: true
        run: pnpm i18n:check
      - name: API client up to date
        id: openapi
        continue-on-error: true
        run: pnpm openapi:check
      - name: Build (fails on a missing translation)
        id: build
        continue-on-error: true
        run: pnpm build
      - name: Bundle budget
        id: budget
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: pnpm budget
      - name: Upload the build
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          retention-days: 3
          if-no-files-found: error
      - name: Gate
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          I18N: ${{ steps.i18n.outcome }}
          OPENAPI: ${{ steps.openapi.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BUDGET: ${{ steps.budget.outcome }}
        run: |
          status=0
          report() {
            echo "$1: $2"
            if [ "$2" != success ]; then echo "::error::$1 failed"; status=1; fi
          }
          report Lint "$LINT"
          report Typecheck "$TYPECHECK"
          report "Unit tests" "$TEST"
          report "Message catalogs" "$I18N"
          report "API client" "$OPENAPI"
          report Build "$BUILD"
          report "Bundle budget" "$BUDGET"
          exit "$status"

  e2e:
    name: End-to-end smoke
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: e2e-debug
          # Release (tag) builds never restore a cache, so a poisoned cache cannot reach them.
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      # A debug build reads web/dist from disk, like `just e2e` does locally.
      - run: cargo build --locked -p binsight
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pnpm' || '' }} # zizmor: ignore[cache-poisoning]
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Read the Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          # Release (tag) builds never restore a cache, so a poisoned cache cannot reach them.
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Install Chromium and its system libraries
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      # Each test starts its own server from target/debug/binsight (web/e2e/fixtures.ts).
      - name: Smoke test
        working-directory: web
        run: pnpm e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # Builds the image for both architectures on every push and tag, and publishes nothing.
  # Publishing is off until the first release. To turn it on, add a job that `needs` every check
  # job above (and `docker`), is the only one granted `packages: write`, and pushes the image.
  docker:
    name: Docker image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture builds natively: emulated Rust builds take an hour.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # Release (tag) builds never use the cache, so a poisoned cache cannot reach them.
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,scope=docker-{0}', matrix.arch) || '' }} # zizmor: ignore[cache-poisoning]
          cache-to: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,mode=max,scope=docker-{0}', matrix.arch) || '' }}
          outputs: type=cacheonly
          provenance: false

  ci-ok:
    name: ci-ok
    # Add a job to this workflow and forget it in `needs` here, and it becomes advisory:
    # a red run would still look green.
    if: always()
    needs: [commits, workflows, fmt, clippy, test, deny, layering, web, e2e, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # GitHub reports a skipped job as passing to branch protection, so here every job must
          # succeed: skipped, failed and cancelled all fail the verdict.
          failed=0
          while read -r job result; do
            echo "$job: $result"
            if [ "$result" != success ]; then
              echo "::error::$job did not pass ($result)"
              failed=1
            fi
          done < <(echo "$RESULTS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"')
          exit "$failed"
