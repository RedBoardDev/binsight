# One workflow, one verdict: every job below must pass for `ci-ok` to pass.
# Each job calls the same `just` recipe a contributor runs locally.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pick the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then range="$BASE..$HEAD"
          elif [[ "$GITHUB_REF" == refs/tags/* ]] || [ "$EVENT" = workflow_dispatch ]; then range=""
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$BEFORE" = "$zero" ]; then range="$SHA~..$SHA"; else range="$BEFORE..$SHA"; fi
          # A branch push is checked from main, not from `before`: after a force-push `before` is unreachable.
          else range="origin/main..$SHA"; fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
      - if: steps.range.outputs.range != ''
        uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f # v1.1.11
        with:
          args: -vv --no-merge-commit
          commits: ${{ steps.range.outputs.range }}

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1

  fmt:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: just@1.58.0
      - run: just rust-fmt-check

  clippy:
    name: Rust lints
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Release (tag) builds never restore a cache, so a poisoned cache cannot reach them.
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: just@1.58.0
      - run: just rust-lint

  test:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Release (tag) builds never restore a cache, so a poisoned cache cannot reach them.
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146
      - run: just rust-test

  deny:
    name: Licenses, advisories and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: just@1.58.0,cargo-deny@0.20.2
      - run: just rust-deny

  layering:
    name: Layering, structure and unused dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Release (tag) builds never restore a cache, so a poisoned cache cannot reach them.
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: just@1.58.0,cargo-machete@0.9.2
      - run: just rust-layering
      - run: just rust-structure
      - run: just rust-unused-deps

  ci-ok:
    name: ci-ok
    # Add a job to this workflow and forget it in `needs` here, and it becomes advisory:
    # a red run would still look green.
    if: always()
    needs: [commits, workflows, fmt, clippy, test, deny, layering]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # GitHub reports a skipped job as passing to branch protection, so here every job must
          # succeed: skipped, failed and cancelled all fail the verdict.
          failed=0
          while read -r job result; do
            echo "$job: $result"
            if [ "$result" != success ]; then
              echo "::error::$job did not pass ($result)"
              failed=1
            fi
          done < <(echo "$RESULTS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"')
          exit "$failed"
