name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For a security problem, do not open an issue:
        use the private report described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `binsight --version`, or the image tag you run.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Docker image
        - Release binary
        - Built from source
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "Debian 13, arm64"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: If the problem is in the web app.
      placeholder: "Firefox 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant log lines. Remove your password and your Helius API key before posting, and any wallet
        address you do not want to make public.
      render: text
  - type: checkboxes
    id: searched
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this bug is not reported yet.
          required: true
