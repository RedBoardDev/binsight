# Production stack for a single VPS, fronted by the host nginx.
# Containers listen on 127.0.0.1 only; the host nginx terminates TLS for the public hostname and
# routes "/" -> web and "/live" (WebSocket) -> api on binsight.thomasott.fr, and the whole API on
# api.binsight.thomasott.fr (for the macOS app). App secrets live in .env.prod on the host; the
# Postgres password lives in the host .env (compose substitution). Neither is ever committed.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
name: binsight

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meteora
      # Substituted from the host .env (next to this file) at parse time — NOT from .env.prod. No
      # fallback on purpose: if it is unset, compose refuses to parse and nothing is replaced, instead
      # of silently using a password committed in the repo. Postgres only applies it when the volume
      # is first initialised; to rotate it see deploy/README.md.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the host .env}
      POSTGRES_DB: meteora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meteora -d meteora']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    # AUTH_SECRET, SOLANA_WS_URL, OWNER_ADDRESS, WEB_ORIGINS, VAPID_* … come from .env.prod.
    env_file: [.env.prod]
    # Reach Postgres over the compose network. The password is substituted from the host .env (same
    # value as POSTGRES_PASSWORD above) so the credential is never committed.
    environment:
      DATABASE_URL: postgres://meteora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the host .env}@postgres:5432/meteora
    ports:
      - '127.0.0.1:8787:8787'
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the client bundle — the browser opens the API WebSocket at this origin.
        NEXT_PUBLIC_API_WS_URL: ${NEXT_PUBLIC_API_WS_URL:-wss://binsight.thomasott.fr}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side only: the BFF reaches the API over the compose network.
      API_URL: http://api:8787
      PORT: '3000'
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
